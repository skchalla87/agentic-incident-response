# Config only. Nothing here is packaged or installed -- host tooling is
# stdlib-only and runs straight out of victim-stack/.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI dependency defaults in signatures

[tool.ruff.lint.isort]
# Container images flatten these onto /app, so they are first-party despite
# living in sibling directories in the repo.
known-first-party = ["obs", "db", "tools", "inject", "verify"]

[tool.pytest.ini_options]
pythonpath = ["victim-stack"]
testpaths = ["victim-stack/tests"]
