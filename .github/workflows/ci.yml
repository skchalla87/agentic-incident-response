name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # Deliberately the same two commands the README tells a human to run.
      # A separate CI-only install recipe is free to drift from the documented
      # setup; this cannot. `make bootstrap` creates the 3.11 venv (uv fetches
      # the interpreter if needed) and `make check` runs ruff + pytest out of it.
      - run: make bootstrap
      - run: make check
